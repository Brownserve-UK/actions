---
name: notify
description: Runs a checked-out repository's '.build/_init.ps1' and calls 'Send-BuildNotification', exactly as the generated per-repo release workflows do.
inputs:
  repo-path:
    description: Path to the checked-out repository root containing '.build/_init.ps1'.
    required: true
  webhook:
    description: The Slack (or compatible) incoming webhook URL to notify.
    required: true
  build-name:
    description: The name of the build/job to report.
    required: true
  build-status:
    description: The status of the build/job to report.
    required: true
  repo-branch:
    description: The branch the build ran on.
    required: true
runs:
  using: composite
  steps:
    - name: notify
      shell: pwsh
      env:
        INPUT_REPO_PATH: ${{ inputs.repo-path }}
        BUILD_NOTIFICATION_WEBHOOK: ${{ inputs.webhook }}
        INPUT_BUILD_NAME: ${{ inputs.build-name }}
        INPUT_BUILD_STATUS: ${{ inputs.build-status }}
        BUILD_BRANCH: ${{ inputs.repo-branch }}
      run: |
        & "$($env:INPUT_REPO_PATH)/.build/_init.ps1"
        Send-BuildNotification `
          -BuildName $env:INPUT_BUILD_NAME `
          -BuildStatus $env:INPUT_BUILD_STATUS `
          -Webhook $env:BUILD_NOTIFICATION_WEBHOOK `
          -RepoBranch $env:BUILD_BRANCH `
          -RepoName $global:BrownserveRepoName
