---
name: brownserve-pr-build
on:
  workflow_call:
    inputs:
      repo-name:
        description: The GitHub repo name, also used as the checkout path.
        required: true
        type: string
      change-pattern:
        description: An extended regular expression matched against changed file paths to decide whether to build.
        required: true
        type: string
      build-task:
        description: The Invoke-Build task to run.
        required: false
        type: string
        default: BuildTestAndCheck
      os-matrix:
        description: A JSON array of runner labels to build on, e.g. '["ubuntu-latest"]' or '["ubuntu-latest", "macos-latest", "windows-latest"]'.
        required: false
        type: string
        default: '["ubuntu-latest"]'
      rust:
        description: Whether the build needs the Rust toolchain.
        required: false
        type: boolean
        default: false
      node:
        description: Whether the build needs Node.js (e.g. to build an Astro/MkDocs site).
        required: false
        type: boolean
        default: false
      mono:
        description: Whether the build needs Mono.
        required: false
        type: boolean
        default: false

jobs:
  check-changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: check-relevant-changes
        id: filter
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_REPOSITORY: ${{ github.repository }}
          INPUT_PATTERN: ${{ inputs.change-pattern }}
        run: |
          FILES=$(gh pr view "$INPUT_PR_NUMBER" \
            --repo "$INPUT_REPOSITORY" \
            --json files --jq '.files[].path')
          if echo "$FILES" | grep -iqE "$INPUT_PATTERN"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "No relevant files changed, skipping build"
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-changes
    if: needs.check-changes.outputs.relevant == 'true'
    strategy:
      matrix:
        os: ${{ fromJSON(inputs.os-matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Step 1: Install Rust
      - name: install-rust
        if: inputs.rust
        shell: bash
        run: rustup toolchain install stable --profile minimal
      # Step 2: Install Node.js
      - name: setup-node
        if: inputs.node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      # Step 3: Install Mono (required to run NuGet.exe on Linux)
      - name: install-mono
        if: inputs.mono
        shell: bash
        run: sudo apt-get install -y mono-complete
      # Step 4: Checkout the repo
      - name: checkout-repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: ${{ inputs.repo-name }}
      # Step 5: Run the build script
      - name: run-build-script
        shell: pwsh
        env:
          INPUT_REPO_NAME: ${{ inputs.repo-name }}
          INPUT_BRANCH_NAME: ${{ github.ref }}
          INPUT_BUILD: ${{ inputs.build-task }}
        run: |
          $Params = @{
            GitHubRepoName = $env:INPUT_REPO_NAME
            BranchName = $env:INPUT_BRANCH_NAME
            Build = $env:INPUT_BUILD
            Verbose = $true
          }
          $OptionalParams = [ordered]@{
            ReleaseType = $env:INPUT_RELEASE_TYPE
            GitHubRepoOwner = $env:INPUT_GITHUB_REPO_OWNER
            GitHubStageReleaseToken = $env:INPUT_GITHUB_STAGE_RELEASE_TOKEN
            GitHubReleaseToken = $env:INPUT_GITHUB_RELEASE_TOKEN
            NugetFeedApiKey = $env:INPUT_NUGET_FEED_API_KEY
            PSGalleryAPIKey = $env:INPUT_PSGALLERY_API_KEY
            DockerHubUsername = $env:INPUT_DOCKERHUB_USERNAME
            DockerHubToken = $env:INPUT_DOCKERHUB_TOKEN
            GHCRToken = $env:INPUT_GHCR_TOKEN
            Target = $env:INPUT_TARGET
            ArchiveSourceDirectory = $env:INPUT_ARCHIVE_SOURCE_DIRECTORY
          }
          foreach ($Param in $OptionalParams.GetEnumerator())
          {
            if ($Param.Value)
            {
              $Params.Add($Param.Key, $Param.Value)
            }
          }
          if ($env:INPUT_PUBLISH_TO)
          {
            $Params.Add('PublishTo', @($env:INPUT_PUBLISH_TO -split ',' | ForEach-Object { $_.Trim().Trim('"', "'") } | Where-Object { $_ }))
          }
          & "./$($env:INPUT_REPO_NAME)/.build/build.ps1" @Params

  # Gate job: always runs (even when 'build' was skipped) and reports the single status check name that
  # branch protection requires. This keeps the required-check name stable whether or not relevant changes
  # are present.
  BuildTestAndCheck:
    needs: [check-changes, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: evaluate-build-result
        env:
          CHECK_CHANGES_RESULT: ${{ needs.check-changes.result }}
          CHECK_CHANGES_RELEVANT: ${{ needs.check-changes.outputs.relevant }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [ "$CHECK_CHANGES_RESULT" != "success" ]; then
            echo "check-changes did not succeed (result: $CHECK_CHANGES_RESULT)"
            exit 1
          fi
          if [ "$CHECK_CHANGES_RELEVANT" == "true" ] && [ "$BUILD_RESULT" != "success" ]; then
            echo "Build did not succeed (result: $BUILD_RESULT)"
            exit 1
          fi
          echo "All required jobs succeeded (or were correctly skipped)"
          exit 0
