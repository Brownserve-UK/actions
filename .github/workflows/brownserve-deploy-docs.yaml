---
name: brownserve-deploy-docs
on:
  workflow_call:
    inputs:
      engine:
        description: Which documentation engine to deploy with, 'mkdocs' or 'astro'.
        required: true
        type: string
      docs-path:
        description: Path to the Astro project (only used when engine is 'astro').
        required: false
        type: string
        default: pages

jobs:
  deploy-docs-mkdocs:
    name: Deploy documentation
    if: inputs.engine == 'mkdocs'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed for gh-deploy to push to gh-pages branch
    steps:
      # Step 1: Checkout the repo
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      # Step 2: Set up Python
      - name: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.x'
      # Step 3: Install MkDocs and build/deploy the site
      - name: deploy-docs
        run: |
          pip install -r requirements.txt
          mkdocs gh-deploy --force

  deploy-docs-astro:
    name: Deploy documentation
    if: inputs.engine == 'astro'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # needed to push to the gh-pages branch
    steps:
      # Step 1: Checkout the repo
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      # Step 2: Install Node.js (Astro requires 22.12 or newer)
      - name: setup-node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      # Step 3: Build the Astro site
      - name: build-docs
        working-directory: ${{ inputs.docs-path }}
        run: |
          npm install --no-audit --no-fund
          npm run build
      # Step 4: Push the built site to the gh-pages branch
      - name: deploy-docs
        working-directory: ${{ inputs.docs-path }}/dist
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          touch .nojekyll
          git init --initial-branch=gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit --message 'docs: deploy documentation site'
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" gh-pages
