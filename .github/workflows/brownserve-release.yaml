---
name: brownserve-release
on:
  workflow_call:
    inputs:
      repo-name:
        description: The GitHub repo name, also used as the checkout path.
        required: true
        type: string
      publish-to:
        description: "Where to publish the release to, e.g. '\"nuget\", \"PSGallery\", \"GitHub\"'. The calling job must grant 'contents: read', plus 'packages: write' when 'GHCR' is included."
        required: true
        type: string
      package-matrix:
        description: Optional JSON array of package job includes, each with an 'os' and a 'target', built before the release job. Leave empty to skip packaging.
        required: false
        type: string
        default: ''
      package-build-task:
        description: The build the package matrix jobs run.
        required: false
        type: string
        default: Package
      node:
        description: Whether the release needs Node.js (e.g. to build an Astro documentation site).
        required: false
        type: boolean
        default: false
      mono:
        description: Whether the release needs Mono (required to run NuGet.exe on Linux).
        required: false
        type: boolean
        default: false
    secrets:
      app-id:
        description: The GitHub App ID used to generate a short-lived token for the release.
        required: true
      app-private-key:
        description: The GitHub App private key used to generate a short-lived token for the release.
        required: true
      nuget-api-key:
        description: nuget.org API key, required when 'nuget' is in publish-to.
        required: false
      psgallery-api-key:
        description: PowerShell Gallery API key, required when 'PSGallery' is in publish-to.
        required: false
      dockerhub-username:
        description: DockerHub username, required when 'DockerHub' is in publish-to.
        required: false
      dockerhub-token:
        description: DockerHub token, required when 'DockerHub' is in publish-to.
        required: false
      slack-webhook:
        description: Slack incoming webhook used to notify on the release result.
        required: true

jobs:
  # Build a native binary on each target platform and upload it as a workflow artifact
  package:
    if: inputs.package-matrix != ''
    strategy:
      matrix:
        include: ${{ fromJSON(inputs.package-matrix || '[]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # Step 1: Checkout the repo
      - name: checkout-repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          path: ${{ inputs.repo-name }}
      # Step 2: Build and archive the binary for this platform
      - name: run-build-script
        shell: pwsh
        env:
          INPUT_REPO_NAME: ${{ inputs.repo-name }}
          INPUT_BRANCH_NAME: ${{ github.ref }}
          INPUT_BUILD: ${{ inputs.package-build-task }}
          INPUT_TARGET: ${{ matrix.target }}
        run: |
          $Params = @{
            GitHubRepoName = $env:INPUT_REPO_NAME
            BranchName = $env:INPUT_BRANCH_NAME
            Build = $env:INPUT_BUILD
            Verbose = $true
          }
          $OptionalParams = [ordered]@{
            ReleaseType = $env:INPUT_RELEASE_TYPE
            GitHubRepoOwner = $env:INPUT_GITHUB_REPO_OWNER
            GitHubStageReleaseToken = $env:INPUT_GITHUB_STAGE_RELEASE_TOKEN
            GitHubReleaseToken = $env:INPUT_GITHUB_RELEASE_TOKEN
            NugetFeedApiKey = $env:INPUT_NUGET_FEED_API_KEY
            PSGalleryAPIKey = $env:INPUT_PSGALLERY_API_KEY
            DockerHubUsername = $env:INPUT_DOCKERHUB_USERNAME
            DockerHubToken = $env:INPUT_DOCKERHUB_TOKEN
            GHCRToken = $env:INPUT_GHCR_TOKEN
            Target = $env:INPUT_TARGET
            ArchiveSourceDirectory = $env:INPUT_ARCHIVE_SOURCE_DIRECTORY
          }
          foreach ($Param in $OptionalParams.GetEnumerator())
          {
            if ($Param.Value)
            {
              $Params.Add($Param.Key, $Param.Value)
            }
          }
          if ($env:INPUT_PUBLISH_TO)
          {
            $Params.Add('PublishTo', @($env:INPUT_PUBLISH_TO -split ',' | ForEach-Object { $_.Trim().Trim('"', "'") } | Where-Object { $_ }))
          }
          & "./$($env:INPUT_REPO_NAME)/.build/build.ps1" @Params
      # Step 3: Upload the archive so the release job can collect it
      - name: upload-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-${{ matrix.target }}
          path: ${{ inputs.repo-name }}/.tmp/output/
          if-no-files-found: error

  # Collect any archives and publish the release
  release:
    needs: [package]
    if: ${{ !cancelled() && (needs.package.result == 'success' || needs.package.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Step 1: Generate a short-lived token from the GitHub App
      - name: generate-app-token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}
      # Step 2: Install Node.js
      - name: setup-node
        if: inputs.node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      # Step 3: Install Mono (required to run NuGet.exe on Linux)
      - name: install-mono
        if: inputs.mono
        shell: bash
        run: sudo apt-get install -y mono-complete
      # Step 4: Download all platform archives into a staging directory outside the repo tree.
      # They are copied into .tmp/output by build.ps1 after _init.ps1 recreates ephemeral directories.
      - name: download-artifacts
        if: inputs.package-matrix != ''
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        with:
          pattern: binary-*
          path: ${{ runner.temp }}/release-archives
          merge-multiple: true
      # Step 5: Checkout the repo
      - name: checkout-repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          path: ${{ inputs.repo-name }}
      # Step 6: Run the release script
      - name: run-build-script
        shell: pwsh
        env:
          INPUT_REPO_NAME: ${{ inputs.repo-name }}
          INPUT_BRANCH_NAME: ${{ github.ref }}
          INPUT_BUILD: Release
          INPUT_PUBLISH_TO: ${{ inputs.publish-to }}
          INPUT_GITHUB_RELEASE_TOKEN: ${{ steps.app-token.outputs.token }}
          INPUT_NUGET_FEED_API_KEY: ${{ secrets.nuget-api-key }}
          INPUT_PSGALLERY_API_KEY: ${{ secrets.psgallery-api-key }}
          INPUT_DOCKERHUB_USERNAME: ${{ secrets.dockerhub-username }}
          INPUT_DOCKERHUB_TOKEN: ${{ secrets.dockerhub-token }}
          INPUT_GHCR_TOKEN: ${{ contains(inputs.publish-to, 'GHCR') && github.token || '' }}
          INPUT_ARCHIVE_SOURCE_DIRECTORY: ${{ inputs.package-matrix != '' && format('{0}/release-archives', runner.temp) || '' }}
        run: |
          $Params = @{
            GitHubRepoName = $env:INPUT_REPO_NAME
            BranchName = $env:INPUT_BRANCH_NAME
            Build = $env:INPUT_BUILD
            Verbose = $true
          }
          $OptionalParams = [ordered]@{
            ReleaseType = $env:INPUT_RELEASE_TYPE
            GitHubRepoOwner = $env:INPUT_GITHUB_REPO_OWNER
            GitHubStageReleaseToken = $env:INPUT_GITHUB_STAGE_RELEASE_TOKEN
            GitHubReleaseToken = $env:INPUT_GITHUB_RELEASE_TOKEN
            NugetFeedApiKey = $env:INPUT_NUGET_FEED_API_KEY
            PSGalleryAPIKey = $env:INPUT_PSGALLERY_API_KEY
            DockerHubUsername = $env:INPUT_DOCKERHUB_USERNAME
            DockerHubToken = $env:INPUT_DOCKERHUB_TOKEN
            GHCRToken = $env:INPUT_GHCR_TOKEN
            Target = $env:INPUT_TARGET
            ArchiveSourceDirectory = $env:INPUT_ARCHIVE_SOURCE_DIRECTORY
          }
          foreach ($Param in $OptionalParams.GetEnumerator())
          {
            if ($Param.Value)
            {
              $Params.Add($Param.Key, $Param.Value)
            }
          }
          if ($env:INPUT_PUBLISH_TO)
          {
            $Params.Add('PublishTo', @($env:INPUT_PUBLISH_TO -split ',' | ForEach-Object { $_.Trim().Trim('"', "'") } | Where-Object { $_ }))
          }
          & "./$($env:INPUT_REPO_NAME)/.build/build.ps1" @Params
      # Step 7: Push a notification to Slack
      - name: notify
        if: ${{ always() }}
        shell: pwsh
        env:
          INPUT_REPO_PATH: ${{ inputs.repo-name }}
          BUILD_NOTIFICATION_WEBHOOK: ${{ secrets.slack-webhook }}
          INPUT_BUILD_NAME: ${{ github.job }}
          INPUT_BUILD_STATUS: ${{ job.status }}
          BUILD_BRANCH: ${{ github.ref }}
        run: |
          & "$($env:INPUT_REPO_PATH)/.build/_init.ps1"
          Send-BuildNotification `
            -BuildName $env:INPUT_BUILD_NAME `
            -BuildStatus $env:INPUT_BUILD_STATUS `
            -Webhook $env:BUILD_NOTIFICATION_WEBHOOK `
            -RepoBranch $env:BUILD_BRANCH `
            -RepoName $global:BrownserveRepoName
