---
name: detect-changes
description: Checks whether the current pull request touched any file matching a pattern, exactly as the generated per-repo 'check-changes' step does.
inputs:
  pattern:
    description: An extended regular expression (as passed to 'grep -iqE') matched against changed file paths.
    required: true
  pr-number:
    description: The pull request number to inspect.
    required: true
  repository:
    description: The 'owner/repo' to inspect.
    required: true
    default: ${{ github.repository }}
  github-token:
    description: "A token with 'pull-requests: read' permission on the repository."
    required: true
outputs:
  relevant:
    description: "'true' if any changed file matches the pattern, otherwise 'false'."
    value: ${{ steps.filter.outputs.relevant }}
runs:
  using: composite
  steps:
    - name: check-relevant-changes
      id: filter
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_PATTERN: ${{ inputs.pattern }}
      run: |
        FILES=$(gh pr view "$INPUT_PR_NUMBER" \
          --repo "$INPUT_REPOSITORY" \
          --json files --jq '.files[].path')
        if echo "$FILES" | grep -iqE "$INPUT_PATTERN"; then
          echo "relevant=true" >> "$GITHUB_OUTPUT"
        else
          echo "No relevant files changed, skipping build"
          echo "relevant=false" >> "$GITHUB_OUTPUT"
        fi
